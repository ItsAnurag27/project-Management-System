name: Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix-branch-name
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  changed-files:
    name: Detect changed project files
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changed-files.outputs.frontend }}
      backend: ${{ steps.changed-files.outputs.backend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed project files
        id: changed-files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
            head="$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          else
            base="HEAD^"
            head="HEAD"
          fi

          changed_files="$(git diff --name-only "$base" "$head" || true)"
          echo "Changed files:"
          echo "$changed_files"

          frontend=false
          backend=false

          if grep -Eq '^(frontend/|package(-lock)?\.json$)' <<< "$changed_files"; then
            frontend=true
          fi

          if grep -Eq '^(gateway/|services/|docker-compose|.*\.xml$)' <<< "$changed_files"; then
            backend=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend build
    needs: changed-files
    if: needs.changed-files.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend build (${{ matrix.project }})
    needs: changed-files
    if: needs.changed-files.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - gateway
          - services/auth-service
          - services/notification-service
          - services/project-service
          - services/task-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build backend
        working-directory: ${{ matrix.project }}
        run: mvn --batch-mode --no-transfer-progress verify
